# Required PR gate for mootmaker-demo-data. See mootmaker/designs/ci-cd-pipeline.md Decision 12.
#
# Same shape as mootmaker-api's, deliberately: both are Maven repositories with a deployable
# impl/ module and a separate verify/ acceptance module.
#
# NEVER add verify/ here. That module is the acceptance suite and needs a real deployed
# environment; PR checks never touch AWS. Acceptance runs in release-build.yml against a
# fresh ephemeral environment instead.
#
# The job name below is the branch-protection contract. Once main requires the
# "unit-tests" context, renaming this job leaves every PR stuck on "Expected - waiting for
# status" with no way to merge. Treat it as frozen.
name: PR checks

on:
  pull_request:
    # No `branches:` filter, deliberately. That filter matches the PR's BASE, so restricting it to
    # main silently exempts every stacked pull request - a PR based on another PR is not based on
    # main, so no run fires at all. mootmaker-webapp had five of seven open PRs in exactly that
    # state before this was fixed there.
    #
    # 'edited' is not optional either. The default activity types are opened/synchronize/reopened;
    # retargeting a PR's base is none of those, it is 'edited'. When a parent merges and GitHub
    # retargets the child, no run fires - and if main's protection requires a context, that PR waits
    # forever on a status that can never arrive, with no push left to trigger it.
    types: [opened, synchronize, reopened, edited]
  # Lets the gate be re-run without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run; nothing here touches shared state, so cancelling
# mid-flight is safe. Deliberately unlike release.yml, which queues rather than cancels.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Java 25 matches maven.compiler.release in impl/pom.xml. If that moves, this moves.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Unit tests (impl/ only)
        run: mvn -B -ntp -f impl/pom.xml test

  # Separate from unit-tests so a formatting failure reads as a formatting failure, and so that
  # job's name stays exactly what branch protection expects.
  #
  # This one DOES cover verify/, which unit-tests must not. That rule is about running the
  # acceptance suite, which needs a deployed environment and real AWS. These steps only parse and
  # analyse source - no test is executed - so its code is held to the same standard as impl/.
  code-style:
    name: code-style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Fails if anything is not in google-java-format's Google style. `mvn spotless:apply` fixes it.
      - name: Formatting (google-java-format)
        run: |
          mvn -B -ntp -f impl/pom.xml spotless:check
          mvn -B -ntp -f verify/pom.xml spotless:check

      # google_checks.xml as shipped; our deviations are in config/checkstyle-suppressions.xml.
      - name: Style (Checkstyle, Google ruleset)
        run: |
          mvn -B -ntp -f impl/pom.xml checkstyle:check
          mvn -B -ntp -f verify/pom.xml checkstyle:check

      # Unused imports and friends. javac cannot see these; the editor can, because it is Eclipse
      # JDT. This is that same compiler, so CI and the editor agree.
      - name: Compiler diagnostics (ecj)
        run: ./lint-java.sh
